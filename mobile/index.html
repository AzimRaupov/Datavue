<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <!-- viewport-fit=cover открывает env(safe-area-inset-*): без него интерфейс уезжает под полосу жестов. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Datavue</title>
    <style>
        /* Пока грузится интерфейс, вместо белого экрана — индикатор. */
        .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #f6f8fb; }
        .boot i { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #d6e2f3; border-top-color: #206bc4; animation: boot-spin .8s linear infinite; }
        @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="app"><div class="boot"><i></i></div></div>
    <script type="module" src="../resources/js/mobile.js"></script>
</body>
</html>
